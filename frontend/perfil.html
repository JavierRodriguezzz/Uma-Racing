<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perfil · UmaRacing</title>
  <link rel="icon" href="/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Press+Start+2P&display=swap">
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body data-pagina="perfil" data-titulo="Mi perfil">
  <main class="contenido pila" id="contenido" hidden>
    <div id="resumen"></div>
    <div class="grid grid-2">
      <section class="tarjeta">
        <h2>Datos del perfil</h2>
        <form id="f-perfil" novalidate>
          <div class="campo"><label for="nombre_mostrar">Nombre para mostrar</label><input id="nombre_mostrar" name="nombre_mostrar" required minlength="2" maxlength="50"></div>
          <div class="campo"><label for="biografia">Biografía</label><textarea id="biografia" name="biografia" maxlength="255"></textarea>
            <span class="ayuda">Máximo 255 caracteres.</span></div>
          <div class="campo" id="campo-fav"><label for="personaje_favorito_id">Corredora favorita</label><select id="personaje_favorito_id" name="personaje_favorito_id"></select>
            <span class="ayuda">Solo puedes elegir corredoras que tengas.</span></div>
          <button class="btn btn-primario" id="b-perfil">Guardar cambios</button>
        </form>
      </section>
      <section class="tarjeta">
        <h2>Cambiar contraseña</h2>
        <form id="f-pass" novalidate>
          <div class="campo"><label for="actual">Contraseña actual</label><input id="actual" name="actual" type="password" autocomplete="current-password" required maxlength="72"></div>
          <div class="campo"><label for="nueva">Nueva contraseña</label><input id="nueva" name="nueva" type="password" autocomplete="new-password" required minlength="8" maxlength="72">
            <span class="ayuda">Mínimo 8 caracteres, con letras y números. Se cerrarán tus otras sesiones.</span></div>
          <div class="campo"><label for="nueva2">Confirmar nueva contraseña</label><input id="nueva2" name="nueva2" type="password" autocomplete="new-password" required maxlength="72"></div>
          <button class="btn" id="b-pass">Actualizar contraseña</button>
        </form>
      </section>
    </div>
    <section class="tarjeta" id="sec-inventario"><h2>Mi inventario</h2><div id="inventario"></div></section>
  </main>
  <script type="module">
    import { get, patch, put } from "/js/api.js";
    import { iniciarPagina } from "/js/layout.js";
    import { $, cargando, conBoton, datosForm, duracion, error, esc, fecha, limpiarErrores, mostrarErrores, num, toast } from "/js/ui.js";

    const usuario = await iniciarPagina();
    const esJugador = usuario.rol === "jugador";

    async function cargar() {
      cargando($("#resumen"), 3);
      try {
        const [p, inv] = await Promise.all([get("/perfil"), esJugador ? get("/perfil/inventario") : { datos: [] }]);
        const s = p.estadisticas, pf = p.perfil;
        $("#resumen").innerHTML = `<section class="tarjeta fila">
          <div class="avatar" style="width:64px;height:64px;font-size:28px">${esc(pf.nombre_mostrar[0].toUpperCase())}</div>
          <div style="flex:1;min-width:200px"><h2 style="margin:0">${esc(pf.nombre_mostrar)}</h2>
            <div class="texto-2">@${esc(p.usuario.username)} · ${esc(p.usuario.email)} · <span class="badge info">${esc(p.usuario.rol)}</span></div>
            <div class="texto-3" style="font-size:13px">Miembro desde ${fecha(pf.creado_en)}</div></div>
          ${esJugador ? `<div class="grid grid-kpi" style="flex:2;min-width:280px">
            <div class="kpi"><span class="etiqueta">Partidas</span><span class="valor">${num(s.partidas)}</span></div>
            <div class="kpi"><span class="etiqueta">Victorias</span><span class="valor">${s.porcentaje_victorias}%</span></div>
            <div class="kpi"><span class="etiqueta">Mejor tiempo</span><span class="valor" style="font-size:1.3rem">${duracion(s.mejor_tiempo_ms)}</span></div>
            <div class="kpi"><span class="etiqueta">Logros</span><span class="valor">${s.logros}/${s.logros_total}</span></div></div>` : ""}
        </section>`;
        const f = $("#f-perfil");
        f.nombre_mostrar.value = pf.nombre_mostrar;
        f.biografia.value = pf.biografia;
        const personajes = inv.datos.filter((i) => i.tipo === "personaje");
        f.personaje_favorito_id.innerHTML = '<option value="">Sin favorita</option>' +
          personajes.map((i) => `<option value="${i.id}" ${i.id === pf.personaje_favorito_id ? "selected" : ""}>${esc(i.nombre)}</option>`).join("");
        $("#campo-fav").hidden = !esJugador;
        $("#sec-inventario").hidden = !esJugador;
        $("#inventario").innerHTML = `<div class="tabla-envoltura"><table><thead><tr><th>Artículo</th><th>Tipo</th><th>Origen</th><th>Adquirido</th></tr></thead><tbody>
          ${inv.datos.map((i) => `<tr><td><strong>${esc(i.nombre)}</strong> ${i.equipado ? '<span class="badge exito">Equipado</span>' : ""}</td>
            <td>${i.tipo === "personaje" ? "Personaje" : "Escenario"}</td><td>${i.origen === "gratuito" ? "Incluido" : esc(i.origen)}</td>
            <td>${i.adquirido_en ? fecha(i.adquirido_en) : "—"}</td></tr>`).join("")}</tbody></table></div>
          <p style="margin-bottom:0"><a href="/tienda.html">Desbloquear más en la tienda →</a></p>`;
      } catch (e) { error($("#resumen"), e, cargar); }
    }

    $("#f-perfil").addEventListener("submit", (e) => {
      e.preventDefault();
      const form = e.target, d = datosForm(form);
      d.personaje_favorito_id = d.personaje_favorito_id ? Number(d.personaje_favorito_id) : null;
      limpiarErrores(form);
      if (d.nombre_mostrar.length < 2) return mostrarErrores(form, { message: "Revisa los datos.", detalles: { nombre_mostrar: "Mínimo 2 caracteres." } });
      conBoton($("#b-perfil"), async () => {
        try { await put("/perfil", d); toast("Perfil actualizado.", "exito"); cargar(); }
        catch (err) { mostrarErrores(form, err); }
      });
    });

    $("#f-pass").addEventListener("submit", (e) => {
      e.preventDefault();
      const form = e.target, d = datosForm(form);
      limpiarErrores(form);
      const err = {};
      if (!d.actual) err.actual = "Escribe tu contraseña actual.";
      if (d.nueva.length < 8 || !/[A-Za-z]/.test(d.nueva) || !/\d/.test(d.nueva)) err.nueva = "Mínimo 8 caracteres, con letras y números.";
      if (d.nueva !== d.nueva2) err.nueva2 = "Las contraseñas no coinciden.";
      if (Object.keys(err).length) return mostrarErrores(form, { message: "Revisa los datos marcados.", detalles: err });
      conBoton($("#b-pass"), async () => {
        try { const r = await patch("/perfil/password", { actual: d.actual, nueva: d.nueva }); toast(r.mensaje, "exito"); form.reset(); }
        catch (error) { mostrarErrores(form, error); }
      });
    });
    cargar();
  </script>
</body>
</html>
