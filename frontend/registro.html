<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta · UmaRacing</title>
  <link rel="icon" href="/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@400;500;600;700&family=Silkscreen&display=swap">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js" defer></script>
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <div class="auth">
    <section class="auth-arte">
      <div class="sol" aria-hidden="true"></div><div class="piso" aria-hidden="true"></div>
      <span class="press">NEW CHALLENGER!</span>
      <h1 class="titulo">ÚNETE A<br>LA CARRERA</h1>
      <p>Recibe 100 monedas de bienvenida y dos corredoras listas: Gold Ship y Oguri Cap.</p>
    </section>
    <section class="auth-form">
      <div class="tarjeta">
        <h2>Nuevo jugador</h2>
        <form id="form" novalidate>
          <div class="campo">
            <label for="username">Nombre de usuario</label>
            <input id="username" name="username" autocomplete="username" required minlength="3" maxlength="30" pattern="[A-Za-z0-9_.]{3,30}">
            <span class="ayuda">3 a 30 caracteres: letras, números, punto o guion bajo.</span>
          </div>
          <div class="campo">
            <label for="nombre_mostrar">Nombre para mostrar <span class="texto-3">(opcional)</span></label>
            <input id="nombre_mostrar" name="nombre_mostrar" maxlength="50">
          </div>
          <div class="campo">
            <label for="email">Correo electrónico</label>
            <input id="email" name="email" type="email" autocomplete="email" required maxlength="120">
          </div>
          <div class="campo">
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="72">
            <span class="ayuda">Mínimo 8 caracteres, con letras y números.</span>
          </div>
          <div class="campo">
            <label for="password2">Confirmar contraseña</label>
            <input id="password2" name="password2" type="password" autocomplete="new-password" required maxlength="72">
          </div>
          <button class="btn btn-primario" style="width:100%" id="crear">Crear cuenta</button>
        </form>
        <p class="texto-2" style="margin-top:16px">¿Ya tienes cuenta? <a href="/login.html">Inicia sesión</a></p>
      </div>
    </section>
  </div>
  <script type="module">
    import { post } from "/js/api.js";
    import { $, conBoton, datosForm, limpiarErrores, mostrarErrores } from "/js/ui.js";

    $("#form").addEventListener("submit", (e) => {
      e.preventDefault();
      const form = e.target;
      const d = datosForm(form);
      limpiarErrores(form);
      const errores = {};
      if (!/^[A-Za-z0-9_.]{3,30}$/.test(d.username)) errores.username = "Usa de 3 a 30 letras, números, punto o guion bajo.";
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email)) errores.email = "Escribe un correo válido.";
      if (d.password.length < 8 || !/[A-Za-z]/.test(d.password) || !/\d/.test(d.password)) errores.password = "Mínimo 8 caracteres, con letras y números.";
      if (d.password !== d.password2) errores.password2 = "Las contraseñas no coinciden.";
      if (Object.keys(errores).length) return mostrarErrores(form, { message: "Revisa los datos marcados.", detalles: errores });

      delete d.password2;
      if (!d.nombre_mostrar) delete d.nombre_mostrar;
      conBoton($("#crear"), async () => {
        try {
          await post("/auth/registro", d);
          location.href = "/login.html?registrado=1";
        } catch (err) {
          mostrarErrores(form, err);
        }
      });
    });
  </script>
</body>
</html>
